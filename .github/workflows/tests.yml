name: TradePilot tests

on:
  push:
    branches:
      - test/learning-duplicate-protection
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run duplicate signal test
        run: |
          python -m pytest -v tests/test_learning_duplicates.py

